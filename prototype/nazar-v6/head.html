/* short names used by the components, mapped onto the Frappe UI scales */
:root {
  --page:var(--surface-base); --bg:var(--surface-base); --fg:var(--ink-gray-8); --card:var(--surface-base); --muted:var(--surface-gray-2); --muted-fg:var(--ink-gray-5); --border:var(--outline-gray-2); --ring:var(--outline-gray-4);
  --primary:var(--surface-gray-10); --primary-fg:var(--ink-base); --accent:var(--ink-blue-7); --accent-soft:var(--surface-blue-2);
  --ok:var(--ink-green-7); --ok-bg:var(--surface-green-2); --warn:var(--ink-amber-7); --warn-bg:var(--surface-amber-2); --rev:var(--ink-violet-7); --rev-bg:var(--surface-violet-2); --err:var(--ink-red-7); --err-bg:var(--surface-red-2);
  --amber:var(--surface-amber-7); --late:var(--surface-red-7);
  /* type scale: six sizes, two weights (500, 600) */
  --t1:12px; --t2:14px; --t3:16px; --t4:20px; --t5:28px; --t6:40px;
}
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; background:var(--page); color:var(--fg); font-family:var(--font); font-size:var(--t2); line-height:1.45; letter-spacing:.01em; font-weight:400; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4,p,ul,ol { margin:0; padding:0; } ul,ol { list-style:none; }
b, strong { font-weight:600; }
button { font:inherit; color:inherit; cursor:pointer; letter-spacing:inherit; }
a { color:inherit; }
:focus-visible { outline:none; box-shadow:var(--focus); }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:0; }
.muted { color:var(--muted-fg); }
.ico { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }


/* buddy: layers are lean (.bd) > loop motion (.bd-b) > one-shot motion (.bd-h) > frames (.bf) */
.bd { position:relative; display:inline-block; flex:none; cursor:pointer; vertical-align:bottom; transition:transform .25s ease-out; -webkit-tap-highlight-color:transparent; }
.bd-b, .bd-h { position:absolute; inset:0; display:block; }
.bf { position:absolute; visibility:hidden; max-width:none; overflow:visible; }
.bf.on { visibility:visible; }
.b-breathe { animation:breathe 3.4s ease-in-out infinite; } .b-sway { animation:sway 4.2s ease-in-out infinite; } .b-bounce { animation:bounce .68s ease-in-out infinite; } .b-shake { animation:shake .6s ease-in-out 1; }
.hop { animation:hop .6s cubic-bezier(.3,.9,.4,1) 1; } .enter { animation:enter .55s cubic-bezier(.2,.7,.2,1) both; }
@keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.015,1.03); } }
@keyframes sway { 0%,100% { transform:rotate(-1.6deg); } 50% { transform:rotate(1.6deg); } }
@keyframes bounce { 0%,100% { transform:translateY(0) scale(1.03,.97); } 50% { transform:translateY(-8px) scale(.98,1.03); } }
@keyframes shake { 0%,100% { transform:none; } 20% { transform:translateX(-4px) rotate(-2deg); } 40% { transform:translateX(4px) rotate(2deg); } 60% { transform:translateX(-3px); } 80% { transform:translateX(3px); } }
@keyframes hop { 0% { transform:none; } 30% { transform:translateY(-9px) scale(.98,1.03); } 60% { transform:translateY(0) scale(1.03,.97); } 100% { transform:none; } }
@keyframes enter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

/* primitives */
/* Button: Frappe UI sizes sm 28 / md 32 / lg 40, radius 8 / 8 / 10. Variants solid (gray-10), outline, subtle, ghost. */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 10px; border-radius:8px; border:1px solid transparent; background:var(--surface-gray-10); color:var(--ink-base); font-weight:500; font-size:var(--t2); white-space:nowrap; text-decoration:none; transition:background-color .12s, border-color .12s; }
.btn:hover:not(:disabled) { background:var(--surface-gray-9); }
.btn:active:not(:disabled) { background:var(--surface-gray-9); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.outline { background:var(--surface-base); color:var(--ink-gray-8); border-color:var(--outline-gray-2); }
.btn.outline:hover:not(:disabled) { border-color:var(--outline-gray-3); background:var(--surface-base); } .btn.outline:active:not(:disabled) { background:var(--surface-gray-4); }
.btn.subtle { background:var(--surface-gray-2); color:var(--ink-gray-8); } .btn.subtle:hover:not(:disabled) { background:var(--surface-gray-3); } .btn.subtle:active:not(:disabled) { background:var(--surface-gray-4); }
.btn.ghost { background:transparent; color:var(--ink-gray-8); } .btn.ghost:hover:not(:disabled) { background:var(--surface-gray-3); } .btn.ghost:active:not(:disabled) { background:var(--surface-gray-4); }
.btn.accent { background:var(--surface-blue-6); color:#fff; } .btn.accent:hover:not(:disabled) { background:var(--surface-blue-7); }
.btn.danger { background:var(--surface-red-2); color:var(--ink-red-7); } .btn.danger:hover:not(:disabled) { background:var(--surface-red-2); filter:brightness(.97); }
.btn.lg { height:40px; padding:0 14px; border-radius:10px; font-size:var(--t2); }
.btn.sm { height:28px; padding:0 8px; font-size:var(--t1); }
.btn.block { width:100%; }
/* Badge: Frappe UI subtle themes, rounded-full, 20px tall */
.badge { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:99px; font-size:var(--t1); font-weight:500; border:1px solid transparent; white-space:nowrap; line-height:1; }
.badge.draft, .badge.gray { background:var(--surface-gray-2); color:var(--ink-gray-6); } .badge.funded, .badge.blue { background:var(--surface-blue-2); color:var(--ink-blue-7); }
.badge.submitted, .badge.violet { background:var(--surface-violet-2); color:var(--ink-violet-7); } .badge.released, .badge.green { background:var(--surface-green-2); color:var(--ink-green-7); }
.badge.changes, .badge.warn, .badge.amber { background:var(--surface-amber-2); color:var(--ink-amber-7); } .badge.err, .badge.dispute, .badge.red { background:var(--surface-red-2); color:var(--ink-red-7); }
.badge.outline, .badge.refunded { border-color:var(--outline-gray-2); color:var(--ink-gray-6); background:transparent; }
.card { background:var(--card); border:1px solid var(--outline-gray-2); border-radius:var(--r-lg); }
.card-h { padding:16px 20px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.card-h h3 { font-size:var(--t2); font-weight:600; color:var(--ink-gray-9); } .card-b { padding:16px 20px 20px; }
.sep { height:1px; background:var(--outline-gray-1); border:0; margin:0; }
/* Input: Frappe UI subtle field, gray-2 fill, white with an outline on focus */
.field { display:grid; gap:6px; } .field label { font-size:var(--t1); font-weight:500; color:var(--ink-gray-5); }
.input, .textarea { font:inherit; height:32px; border:1px solid transparent; border-radius:8px; background:var(--surface-gray-2); padding:0 10px; color:var(--ink-gray-8); width:100%; transition:background-color .12s, border-color .12s; }
.input:hover, .textarea:hover { background:var(--surface-gray-3); }
.textarea { height:auto; padding:8px 10px; resize:vertical; min-height:88px; line-height:1.5; }
.input:focus, .textarea:focus { outline:none; background:var(--surface-base); border-color:var(--outline-gray-4); box-shadow:var(--focus); }
.input::placeholder, .textarea::placeholder { color:var(--ink-gray-4); }
.input.bad, .textarea.bad { border-color:var(--outline-red-3); background:var(--surface-red-2); } .hint-err { color:var(--err); font-size:var(--t1); }
.hint { color:var(--ink-gray-5); font-size:var(--t1); }
.progress { height:6px; border-radius:99px; background:var(--surface-gray-3); overflow:hidden; } .progress i { display:block; height:100%; background:var(--surface-gray-10); border-radius:99px; transition:width .4s; }
/* Tab buttons: Frappe UI segmented control */
.tabs { display:inline-flex; background:var(--surface-gray-2); border-radius:8px; padding:2px; gap:2px; max-width:100%; overflow-x:auto; }
.tabs button { height:28px; padding:0 10px; border-radius:7px; font-size:var(--t1); font-weight:500; color:var(--ink-gray-5); border:0; background:transparent; white-space:nowrap; }
.tabs button:hover { color:var(--ink-gray-8); }
.tabs button[aria-selected="true"] { background:var(--surface-base); color:var(--ink-gray-9); box-shadow:var(--shadow-sm); }
.alert { display:flex; gap:12px; padding:12px 14px; border:1px solid var(--outline-gray-2); border-radius:var(--r-lg); background:var(--surface-gray-1); align-items:flex-start; }
.alert b { display:block; font-weight:600; }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:var(--t1); font-weight:600; flex:none; }
.avatar.warm { background:#FFE9D6; color:#8A4B12; }
.logo { display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:-.01em; }
.logo .m { width:24px; height:24px; border-radius:7px; background:var(--brand); color:#fff; display:grid; place-items:center; } .logo .m .ico { width:14px; height:14px; }
.kv { display:grid; gap:8px; } .kv > div { display:flex; justify-content:space-between; gap:12px; } .kv .tot { border-top:1px solid var(--border); padding-top:8px; font-weight:600; }
.h1 { font-size:var(--t4); font-weight:600; letter-spacing:-.01em; line-height:1.25; color:var(--ink-gray-9); text-wrap:balance; }
.lbl { font-size:var(--t1); font-weight:500; color:var(--ink-gray-5); }

/* shell: Frappe UI sidebar (surface-sidebar, 28px items, selected item lifts onto white) */
.topbar { height:48px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--outline-gray-1); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); position:sticky; top:0; z-index:20; }
.crumbs { display:flex; align-items:center; gap:6px; color:var(--ink-gray-5); min-width:0; font-size:var(--t2); } .crumbs b { color:var(--ink-gray-9); font-weight:500; } .crumbs .ico { width:14px; height:14px; }
.crumbs span, .crumbs b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shell { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh; background:var(--bg); }
.side { background:var(--surface-sidebar); border-right:1px solid var(--outline-gray-1); padding:12px 8px; display:flex; flex-direction:column; gap:16px; position:sticky; top:0; height:100vh; }
.side .grp { display:grid; gap:1px; } .side .glbl { font-size:var(--t1); font-weight:500; color:var(--ink-gray-5); padding:0 8px 4px; }
.side a, .side button.nav { display:flex; align-items:center; gap:8px; height:30px; padding:0 8px; border-radius:8px; color:var(--ink-gray-7); text-decoration:none; font-weight:400; font-size:var(--t2); border:0; background:transparent; text-align:left; width:100%; transition:background-color .12s; }
.side a:hover, .side button.nav:hover { background:var(--surface-gray-3); } .side .on { background:var(--surface-base) !important; color:var(--ink-gray-9); box-shadow:var(--shadow-sm); font-weight:500; }
.side .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); margin:0 4px; }
.main { padding:28px 32px 120px; display:grid; grid-template-columns:minmax(0,1fr); gap:24px; align-content:start; min-width:0; max-width:1180px; width:100%; margin-inline:auto; }
.ph > * { min-width:0; }
.ph { display:flex; flex-wrap:wrap; gap:12px 24px; justify-content:space-between; align-items:flex-end; }
.cols { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:24px; align-items:start; }
.stack { display:grid; gap:24px; min-width:0; }
.clientwrap { min-height:100vh; background:var(--bg); }

/* hero + dropzone */
.hero { padding:24px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; }
.hero h3 { font-size:var(--t4); font-weight:600; letter-spacing:-.01em; line-height:1.25; margin:8px 0 4px; color:var(--ink-gray-9); text-wrap:balance; }
.hero .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center; }
.hero .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.drop { margin:0 24px 24px; border:1px dashed var(--outline-gray-3); border-radius:var(--r-lg); background:var(--surface-gray-1); padding:20px 24px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 24px; align-items:center; transition:background .15s, border-color .15s; }
.drop.over { background:var(--accent-soft); border-color:var(--accent); }
.drop.locked { border-color:var(--border); background:var(--muted); opacity:.75; }
.drop b { display:block; font-size:var(--t3); font-weight:600; }
.drop .btns { grid-column:2; display:flex; gap:8px; flex-wrap:wrap; }
.ill { fill:none; stroke:var(--mk-ink); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; display:block; }
.ill .acc { stroke:var(--accent); } .ill .soft { fill:var(--accent-soft); stroke:none; } .ill .bgf { fill:var(--bg); } .ill .adot { fill:var(--accent); stroke:none; }
.files { display:grid; gap:8px; padding:0 24px 20px; }
.file { display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r); background:var(--bg); }
.file .ic { width:36px; height:36px; border-radius:8px; background:var(--muted); display:grid; place-items:center; font-size:var(--t1); font-weight:600; font-family:var(--mono); }
.file .nm { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file .bar { height:4px; border-radius:99px; background:var(--muted); overflow:hidden; margin-top:6px; } .file .bar i { display:block; height:100%; width:0; background:var(--accent); animation:fill 1s ease-out forwards; }
@keyframes fill { to { width:100%; } }
.ok { color:var(--ok); font-weight:500; font-size:var(--t1); display:flex; gap:6px; align-items:center; }
.tick { animation:tickin .35s cubic-bezier(.2,.7,.2,1) both; } @keyframes tickin { from { transform:scale(0); } to { transform:scale(1); } }
.submitbar { margin:0 24px 24px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; padding:16px; border-radius:var(--r-lg); background:var(--muted); }
.note { margin:0 24px 16px; padding:12px 16px; border-radius:var(--r); background:var(--warn-bg); color:var(--warn); }
.note b { display:block; }

/* rows */
.rows > li { display:grid; grid-template-columns:28px minmax(0,1fr) auto auto; gap:12px 16px; align-items:center; padding:12px 20px; border-top:1px solid var(--border); cursor:pointer; transition:background .12s; }
.rows > li:first-child { border-top:0; } .rows > li:hover { background:var(--muted); }
.rows .n { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); display:grid; place-items:center; font-size:var(--t1); font-weight:500; color:var(--muted-fg); }
.rows > li.cur .n { background:var(--surface-gray-10); color:var(--ink-base); border-color:var(--surface-gray-10); }
.rows > li.sel { background:var(--muted); }
.rows .nm { font-weight:500; color:var(--ink-gray-9); } .rows .sub { font-size:var(--t1); color:var(--muted-fg); }
.scope { display:grid; gap:4px; margin-top:6px; font-size:var(--t1); color:var(--ink-gray-7); } .scope li { display:grid; grid-template-columns:14px minmax(0,1fr); gap:6px; align-items:start; } .scope li::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--ink-gray-4); margin:7px 0 0 4px; }
.scope.tick li::before { display:none; } .scope .tk { width:14px; height:14px; color:var(--ink-green-7); margin-top:2px; stroke-width:2.5; }
.rows.withscope > li { align-items:start; } .rows.withscope > li > .mono, .rows.withscope > li > .badge { margin-top:4px; }
.field .seg { justify-self:start; }
.scopebox { padding:12px 14px; border-radius:var(--r); background:var(--surface-gray-1); border:1px solid var(--outline-gray-1); }
.scopebox .lbl { display:block; margin-bottom:2px; }
table { width:100%; border-collapse:collapse; } th { text-align:left; font-size:var(--t1); font-weight:500; color:var(--muted-fg); padding:10px 20px; border-bottom:1px solid var(--border); white-space:nowrap; } td { padding:12px 20px; border-top:1px solid var(--border); vertical-align:middle; }
.tscroll { overflow-x:auto; }
/* filter table */
.fbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:12px; } .fbar .input { flex:0 1 260px; min-width:0; }
.fchips { display:flex; align-items:center; gap:4px; min-width:0; max-width:100%; overflow-x:auto; padding:4px; margin:-4px; scrollbar-width:none; } .fchips::-webkit-scrollbar { display:none; }
.fchip { flex:none; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:99px; border:1px solid transparent; background:transparent; color:var(--muted-fg); font-size:var(--t1); font-weight:500; white-space:nowrap; transition:background-color .2s, box-shadow .2s, color .2s, border-color .2s; }
.fchip:hover { background:var(--muted); }
.fchip[aria-pressed="true"] { background:var(--card); color:var(--fg); border-color:var(--border); box-shadow:0 1px 2px rgba(9,9,11,.08); }
.fdot { width:6px; height:6px; border-radius:50%; flex:none; }
.fcount { font-size:var(--t1); padding:0 4px; border-radius:4px; color:var(--muted-fg); font-variant-numeric:tabular-nums; } .fchip[aria-pressed="true"] .fcount { background:var(--muted); color:var(--muted-fg); }
.ftable { overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--card); box-shadow:0 1px 2px rgba(9,9,11,.04); scrollbar-width:none; } .ftable::-webkit-scrollbar { display:none; }
.fgrid { min-width:var(--min,480px); }
.fhead, .fr { display:grid; grid-template-columns:var(--cols); }
.fhead { border-bottom:1px solid var(--border); font-size:var(--t1); font-weight:500; color:var(--muted-fg); }
.fhead > span, .fc { min-width:0; padding:10px 16px; border-right:1px solid var(--border); } .fhead > span:last-child, .fc:last-child { border-right:0; }
.fc { display:flex; align-items:center; padding-top:12px; padding-bottom:12px; font-size:var(--t2); }
.frow { display:grid; grid-template-rows:1fr; opacity:1; transition:grid-template-rows .3s cubic-bezier(.23,1,.32,1), opacity .3s cubic-bezier(.23,1,.32,1); }
.frow[data-shown="0"] { grid-template-rows:0fr; opacity:0; }
.fclip { overflow:hidden; min-height:0; }
.fr { border-bottom:1px solid var(--border); transition:background-color .1s; } .fr:hover { background:var(--muted); } .fr[data-a] { cursor:pointer; }
.frow[data-last="1"] .fr { border-bottom:0; }
.f-empty[hidden] { display:none; }

/* feedback note: selection-actions bar */
.fb-host { position:relative; padding-bottom:48px; } .fb-host .textarea { display:block; }
.fb-pass { border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:10px 12px; white-space:pre-wrap; font-size:var(--t2); line-height:1.55; overflow:auto; } .fb-pass[hidden] { display:none; }
.fb-sel { box-decoration-break:clone; -webkit-box-decoration-break:clone; border-radius:3px; background:color-mix(in srgb, var(--accent) 14%, var(--card)); }
.fb-float { position:absolute; top:0; left:0; z-index:5; transition:transform .32s cubic-bezier(.77,0,.175,1), opacity .18s ease-out; will-change:transform; }
.fb-bar { display:flex; height:36px; width:fit-content; max-width:var(--fbw,100%); align-items:center; justify-content:center; gap:2px; overflow:hidden; border-radius:99px; background:var(--card); border:1px solid var(--border); padding:3px; box-shadow:0 10px 28px -10px rgba(9,9,11,.3), 0 2px 6px rgba(9,9,11,.08); font-size:var(--t1); color:var(--fg); transition:border-color .15s; }
.fb-bar:focus-within { border-color:var(--ring); } .fb-bar .ico { width:14px; height:14px; stroke-width:1.8; }
.fb-in { display:flex; align-items:center; justify-content:center; gap:2px; width:fit-content; flex:none; }
.fb-prompt, .fb-acts, .fb-more, .fb-sendwrap { display:flex; align-items:center; gap:2px; min-width:0; overflow:hidden; transition:max-width .4s cubic-bezier(.23,1,.32,1), opacity .4s cubic-bezier(.23,1,.32,1), transform .4s cubic-bezier(.23,1,.32,1), margin .4s cubic-bezier(.23,1,.32,1); }
.fb-form { display:flex; align-items:center; height:28px; margin:0; flex:none; transition:width .4s cubic-bezier(.23,1,.32,1); }
.fb-input { display:block; width:100%; height:28px; line-height:28px; border:0; outline:0; background:transparent; padding:0 10px 0 12px; font:inherit; font-size:var(--t1); line-height:28px; color:var(--fg); } .fb-input::placeholder { color:var(--muted-fg); }
.fb-q, .fb-keep { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:0; border-radius:99px; background:transparent; color:var(--fg); font:inherit; font-size:var(--t1); white-space:nowrap; flex:none; cursor:pointer; transition:background-color .15s, transform .15s, opacity .15s; }
.fb-q:hover { background:var(--muted); } .fb-q:active, .fb-keep:active, .fb-retry:active, .fb-chev:active { transform:scale(.96); }
.fb-keep { background:var(--primary); color:var(--primary-fg); box-shadow:0 0 0 1px rgba(9,9,11,.12); } .fb-keep:hover { opacity:.9; }
.fb-div { width:1px; height:16px; background:var(--border); flex:none; margin:0 2px; }
.fb-chev, .fb-retry { width:28px; height:28px; border:0; border-radius:99px; background:transparent; color:var(--fg); display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; transition:background-color .2s, transform .15s; } .fb-chev:hover, .fb-retry:hover { background:var(--muted); } .fb-retry { color:var(--muted-fg); }
.fb-chevi { display:flex; transition:transform .4s cubic-bezier(.23,1,.32,1); }
.fb-send { width:28px; height:28px; border:0; border-radius:99px; background:var(--primary); color:var(--primary-fg); display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; transition:opacity .2s, transform .2s; } .fb-send:active { transform:scale(.94); }
.fb-busy { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; color:var(--muted-fg); white-space:nowrap; }
.fb-spin { width:12px; height:12px; border-radius:50%; border:1.5px solid var(--border); border-top-color:var(--muted-fg); animation:fbspin .7s linear infinite; flex:none; }
.fb-shim { background:linear-gradient(90deg, var(--muted-fg) 35%, var(--fg) 50%, var(--muted-fg) 65%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:fbshim 1.4s linear infinite; }
.fb-narrow .fb-more .fb-q span { display:none; } .fb-narrow .fb-more .fb-q { padding:0 8px; }
@keyframes fbspin { to { transform:rotate(360deg); } } @keyframes fbshim { from { background-position:100% 0; } to { background-position:-100% 0; } }
@keyframes pop-in { from { opacity:0; transform:scale(.92) translateY(-4px); } to { opacity:1; transform:none; } }

/* calendar */
.cal-head { display:flex; align-items:center; justify-content:space-between; }
.cal-head button { width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--card); line-height:1; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; margin-top:8px; }
.cal-grid .dow { font-size:var(--t1); color:var(--muted-fg); padding-bottom:4px; }
.d { aspect-ratio:1; display:grid; place-items:center; font-size:var(--t1); border-radius:8px; font-family:var(--mono); }
.d.out { color:var(--muted-fg); opacity:.45; } .d.today { background:var(--muted); font-weight:600; }
.d.due { background:var(--primary); color:var(--primary-fg); font-weight:600; } .d.done { background:var(--ok-bg); color:var(--ok); font-weight:600; }
.d.rv { outline:1.5px dashed var(--rev); outline-offset:-3px; color:var(--rev); font-weight:600; }
.legend { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:var(--t1); color:var(--muted-fg); margin-top:12px; } .legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--primary); margin-right:6px; vertical-align:-1px; }
.legend span.r::before { background:transparent; border:1.5px dashed var(--rev); border-radius:50%; } .legend span.g::before { background:var(--ok); }
.ag li { display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; padding:8px 0; border-top:1px solid var(--border); } .ag li:first-child { border-top:0; }
.ag .dt { text-align:center; line-height:1.1; } .ag .dt b { display:block; font-family:var(--mono); font-size:var(--t3); font-weight:500; } .ag .dt span { font-size:var(--t1); color:var(--muted-fg); text-transform:uppercase; }


.pcard { margin:0 8px; padding:12px; border:1px solid var(--border); border-radius:var(--r); display:grid; gap:8px; background:var(--card); }
.pcard b { font-weight:500; line-height:1.3; } .pcard .progress { height:4px; }
.mnav { display:none; gap:6px; padding:8px 16px; overflow-x:auto; border-bottom:1px solid var(--border); background:var(--bg); }
.mnav button { flex:none; border:1px solid var(--border); background:var(--card); border-radius:99px; padding:4px 12px; font-size:var(--t1); font-weight:500; display:flex; gap:6px; align-items:center; }
.mnav button.on { background:var(--primary); color:var(--primary-fg); border-color:var(--primary); }
.bigcal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--border); border-left:1px solid var(--border); margin-top:12px; }
.bigcal .dow { padding:6px 8px; font-size:var(--t1); font-weight:500; color:var(--muted-fg); border-right:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--muted); }
.bigcal .cell { min-height:96px; padding:6px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); display:grid; gap:4px; align-content:start; min-width:0; }
.bigcal .cell.out { background:var(--muted); } .bigcal .cell.out .num { opacity:.4; }
.bigcal .num { font-family:var(--mono); font-size:var(--t1); color:var(--muted-fg); width:22px; height:22px; border-radius:99px; display:grid; place-items:center; }
.bigcal .cell.today .num { background:var(--fg); color:var(--bg); font-weight:600; }
.bigcal .chip { font-size:var(--t1); font-weight:500; padding:2px 6px; border-radius:6px; background:var(--primary); color:var(--primary-fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bigcal .chip.done { background:var(--ok-bg); color:var(--ok); } .bigcal .chip.rv { background:var(--rev-bg); color:var(--rev); border:1px dashed var(--rev); }


/* command centre */
.side .count { margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--surface-red-7); color:#fff; font-size:var(--t1); display:grid; place-items:center; font-weight:600; }
.side .accentnav { color:var(--ink-gray-8); } .side .accentnav:hover { background:var(--surface-gray-3) !important; }
.who { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; }
.linkb { border:0; background:transparent; padding:0; color:var(--muted-fg); text-decoration:underline; text-underline-offset:3px; } .linkb:hover { color:var(--fg); }
.avatar.big { width:44px; height:44px; font-size:var(--t2); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
select.input { appearance:auto; }
.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; } .kpis.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
.kpi { text-align:left; display:grid; gap:2px; padding:14px 16px; border:1px solid var(--outline-gray-2); border-radius:var(--r-lg); background:var(--card); }
.kpi.static { cursor:default; }
.kpi .kv2 { font-size:var(--t4); font-weight:600; line-height:1.3; color:var(--ink-gray-9); }
.kpi.red { border-color:color-mix(in srgb, var(--err) 40%, var(--border)); background:color-mix(in srgb, var(--err-bg) 60%, var(--card)); } .kpi.red .kv2 { color:var(--err); }
.chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.chipb { border:1px solid var(--border); background:var(--card); border-radius:99px; padding:3px 12px; font-size:var(--t1); font-weight:500; transition:background .12s; } .chipb:hover { background:var(--muted); }
.chipb[aria-selected="true"] { background:var(--primary); color:var(--primary-fg); border-color:var(--primary); } .chipb[aria-selected="true"] .muted { color:inherit; opacity:.7; }
.grphead { display:flex; align-items:center; gap:8px; padding:12px 20px 4px; font-size:var(--t1); font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-fg); }
.att-list li, .att { display:grid; grid-template-columns:10px 32px minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px 20px; border-top:1px solid var(--border); }
.att-list li:first-child { border-top:0; }
.att { cursor:pointer; transition:background .12s; } .att:hover { background:var(--muted); }
.att .at-main { min-width:0; } .att .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--t1); } .att .sub { font-size:var(--t1); color:var(--muted-fg); }
.att .what { font-size:var(--t2); font-weight:600; margin-top:2px; color:var(--ink-gray-9); } .att.wait .what { font-weight:500; }
.att.urgent .what { color:var(--ink-red-7); }
.att .ctx { font-size:var(--t1); color:var(--muted-fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.att .act { display:flex; align-items:center; gap:16px; justify-self:end; } .att .amt { font-size:var(--t1); font-weight:500; min-width:72px; text-align:right; } .att .act .btn { min-width:108px; justify-content:center; }
.card.focus { border-color:var(--outline-gray-2); box-shadow:var(--shadow-sm); }
.card.focus .card-h { padding-top:18px; } .card.focus .card-h h3 { font-size:var(--t3); }
.card.quiet { box-shadow:none; } .card.quiet .waitb { font-size:var(--t1); color:var(--muted-fg); } .card.quiet .waitb b { color:var(--fg); }
.fgb { color:var(--fg); font-weight:600; }
.exp { display:grid; gap:2px; } .exp-t { font-size:var(--t4); font-weight:600; line-height:1.25; color:var(--ink-gray-9); }
.exp-l { display:grid; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:var(--t1); }
.exp-l li { display:grid; grid-template-columns:8px minmax(0,1fr) auto; gap:10px; align-items:center; } .exp-l .mono { font-size:var(--t1); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted-fg); } .dot.submitted { background:var(--rev); } .dot.funded { background:var(--accent); } .dot.draft { background:var(--border); box-shadow:inset 0 0 0 1.5px var(--muted-fg); }
.sev { width:8px; height:8px; border-radius:50%; background:var(--ink-gray-4); flex:none; } .sev.red { background:var(--surface-red-7); } .sev.amber, .sev.blue { background:var(--surface-amber-7); } .sev.yellow { background:transparent; box-shadow:inset 0 0 0 1.5px var(--outline-gray-4); }
.clear { display:flex; gap:16px; align-items:center; padding:12px 20px; }
.sampleb { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:12px 16px; border:1px dashed var(--outline-gray-3); border-radius:var(--r-lg); background:var(--surface-gray-1); } .sampleb > div:nth-child(2) { flex:1; min-width:200px; }
.clickrow { cursor:pointer; transition:background .12s; } .clickrow:hover { background:var(--muted); }
.d sup { font-size:var(--t1); margin-left:1px; }
.preview { width:min(560px,100%); text-align:left; margin-top:8px; }
.preview .att-list li { grid-template-columns:10px 32px minmax(0,1fr) auto; }
.preview b { font-weight:500; } .preview .muted { font-size:var(--t1); }
@media (max-width:900px) {
  .kpis, .kpis.three { grid-template-columns:repeat(2,minmax(0,1fr)); } .two { grid-template-columns:minmax(0,1fr); }
  .att-list li, .att { grid-template-columns:10px 32px minmax(0,1fr); padding:14px 16px; row-gap:8px; }
  .att .act { grid-column:3; justify-self:stretch; justify-content:space-between; } .att .amt { min-width:0; text-align:left; } .att .act .btn { min-width:0; }
  .att .ctx { white-space:normal; }
}
@media (max-width:640px) { .kpis.three { grid-template-columns:minmax(0,1fr); } .kpi .kv2 { font-size:var(--t4); } }


/* client colour + logo */
.logo-av { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; overflow:hidden; flex:none; background:color-mix(in srgb, var(--c) 16%, var(--bg)); color:var(--c); font-size:var(--t1); font-weight:600; }
.logo-av b { font-weight:600; } .logo-av img { width:100%; height:100%; object-fit:contain; padding:5px; background:#fff; }
.logo-av.big { width:44px; height:44px; border-radius:12px; font-size:var(--t2); }
.idrow { display:flex; gap:16px; align-items:center; }
.swatches .sw { width:24px; height:24px; }
.d { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.d.has { background:color-mix(in srgb, var(--c) 14%, transparent); }

.waitb { border-radius:var(--r-lg); } .rot { transform:rotate(90deg); transition:transform .2s; }

.lp-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr); gap:16px; } .lp-card.lead { background:var(--surface-gray-1); } .lp-card.lead h3 { font-size:var(--t4); }

.lp-steps li { display:grid; gap:6px; align-content:start; padding-top:4px; } .lp-steps i { font-style:normal; width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--primary-fg); display:grid; place-items:center; font-weight:600; font-family:var(--mono); font-size:var(--t1); margin-bottom:6px; }

}

/* landing / setup / onboarding */
.landing { padding:48px 24px 72px; text-align:center; max-width:820px; margin:0 auto; display:grid; gap:16px; justify-items:center; }

.landing .sub { font-size:var(--t3); color:var(--muted-fg); max-width:560px; text-wrap:pretty; }
.chain { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-top:32px; text-align:left; width:100%; }
.chain li { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px; }

.centerpage { min-height:100vh; display:grid; place-items:start center; padding:32px 16px 64px; background:var(--surface-gray-1); }
.formcard { width:min(560px,100%); display:grid; gap:20px; }

.plain { display:grid; gap:8px; } .plain li { display:grid; grid-template-columns:auto 1fr; gap:10px; } .plain li::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:8px; }
.check { display:flex; gap:10px; align-items:flex-start; } .check input { margin-top:4px; width:16px; height:16px; accent-color:var(--fg); }
.onb { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); overflow:hidden; }
.onb .art { background:var(--muted); display:grid; place-items:center; padding:32px; } .onb .body { padding:32px; display:grid; gap:20px; align-content:center; }
.steps li { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--border); } .steps li:first-child { border-top:0; }
.steps .c { width:24px; height:24px; border-radius:50%; border:1.5px solid var(--border); display:grid; place-items:center; } .steps li.done .c { background:var(--ok); border-color:var(--ok); color:#fff; } .steps li.now .c { border-color:var(--fg); }
.steps li.done b { color:var(--muted-fg); text-decoration:line-through; text-decoration-thickness:1px; } .steps b { font-weight:500; }
.mrow { display:grid; grid-template-columns:24px minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) 32px; gap:8px 12px; align-items:end; padding:14px 0; border-top:1px solid var(--outline-gray-1); }
.mrow .inc { grid-column:2 / 5; } .mrow .inc .textarea { min-height:64px; }
.mrow:first-of-type { border-top:0; } .mrow .idx { font-family:var(--mono); font-weight:500; color:var(--muted-fg); padding-bottom:8px; }
.rules { display:flex; flex-wrap:wrap; gap:8px; } .rules span { background:var(--muted); border-radius:99px; padding:4px 12px; font-size:var(--t1); font-weight:500; }

/* client */
.stage { position:relative; aspect-ratio:16/10; border-radius:12px; overflow:hidden; background:#EFEFEA; user-select:none; border:1px solid var(--border); display:grid; place-items:center; }
.stage img { width:100%; height:100%; object-fit:contain; display:block; -webkit-user-drag:none; }
.stage .docp { display:grid; gap:8px; justify-items:center; text-align:center; color:#3F3F46; padding:24px; }
.stage .docp .pg { width:150px; aspect-ratio:3/4; background:#fff; border:1px solid #D4D4D8; border-radius:6px; padding:14px 12px; display:grid; gap:6px; align-content:start; box-shadow:0 8px 20px -10px rgba(9,9,11,.3); }
.stage .docp .pg i { height:5px; border-radius:3px; background:#D4D4D8; } .stage .docp .pg i:nth-child(1) { width:60%; background:#A1A1AA; }
.wm { position:absolute; inset:0; background-image:var(--wm); background-size:380px 240px; pointer-events:none; }
.stage img, .stage video { -webkit-user-drag:none; } .stage video { width:100%; height:100%; object-fit:contain; background:#111; display:block; }

.stage .page img { display:block; width:100%; height:auto; object-fit:fill; }
.stage .page.flowpg { padding:44px 52px 52px; min-height:420px; } .stage .flow { font-size:var(--t2); line-height:1.65; } .stage .flow h1, .stage .flow h2, .stage .flow h3 { font-size:var(--t3); font-weight:600; margin:18px 0 6px; color:#18181B; } .stage .flow p { margin:0 0 10px; } .stage .flow ul, .stage .flow ol { margin:0 0 10px; padding-left:20px; list-style:revert; } .stage .flow img { max-width:100%; height:auto; } .stage .flow pre { white-space:pre-wrap; font-family:var(--mono); font-size:var(--t1); }
.stage .sp { padding:8% 9% 10%; aspect-ratio:1/1.3; font-size:var(--t2); line-height:1.6; } .stage .sp p { margin:0 0 10px; color:#3F3F46; } .stage .sp .sp-k { font-size:var(--t1); letter-spacing:.14em; text-transform:uppercase; color:#71717A; margin:0; } .stage .sp .sp-h { font-size:var(--t5); line-height:1.15; letter-spacing:-.02em; margin:8px 0 4px; color:#18181B; font-weight:600; } .stage .sp .sp-d { color:#71717A; margin-bottom:18px; } .stage .sp .sp-blk { height:130px; border-radius:6px; margin:14px 0; } .stage .sp ul { padding-left:18px; list-style:disc; color:#3F3F46; } .stage .sp .sp-cols { display:grid; grid-template-columns:1.3fr 1fr; gap:24px; margin-top:12px; }
.stage .pgnote { font-size:var(--t1); color:#52525B; text-align:center; } .stage .pgwait { min-height:260px; display:flex; align-items:center; justify-content:center; gap:10px; color:#52525B; font-size:var(--t2); }
@media print { .stage { display:none !important; } }
.reassure { display:flex; gap:12px; align-items:center; color:var(--muted-fg); font-size:var(--t1); }
.pay2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; width:min(900px,100%); }
.celebrate { text-align:center; display:grid; gap:16px; justify-items:center; }
.seal { width:56px; height:56px; }
.seal circle { stroke-dasharray:160; stroke-dashoffset:160; animation:draw .7s .1s ease-out forwards; } .seal path { stroke-dasharray:40; stroke-dashoffset:40; animation:draw .45s .6s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }
.sheet { background:#fff; color:#18181B; border:1px solid #D4D4D8; border-radius:8px; padding:20px; font-family:var(--code); font-size:var(--t1); position:relative; text-align:left; letter-spacing:0; }
.sheet h4 { font-family:var(--font); font-size:var(--t3); font-weight:600; margin-bottom:2px; } .sheet hr { border:0; border-top:1px dashed #D4D4D8; margin:12px 0; }
.sheet .ln { display:flex; justify-content:space-between; gap:12px; padding:2px 0; } .sheet .ln.t { font-weight:600; font-size:var(--t2); border-top:1px solid #18181B; margin-top:6px; padding-top:6px; }

.docs2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }

/* overlays */
.overlay { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.4); display:grid; place-items:center; padding:16px; overflow:auto; animation:fadein .15s both; }
@keyframes fadein { from { opacity:0; } to { opacity:1; } }

.radio { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--outline-gray-2); border-radius:var(--r); cursor:pointer; } .radio:hover { background:var(--surface-gray-1); }
.radio input { margin-top:3px; accent-color:var(--surface-gray-10); } .radio:has(input:checked) { border-color:var(--outline-gray-4); background:var(--surface-gray-1); }
.seg { display:inline-flex; background:var(--surface-gray-2); border-radius:8px; padding:2px; gap:2px; }

.seg button[aria-pressed="true"] { background:var(--surface-base); color:var(--ink-gray-9); box-shadow:var(--shadow-sm); } .seg button:disabled { opacity:.45; cursor:not-allowed; }
.msgprev { white-space:pre-wrap; }

.linkbox { display:flex; gap:8px; } .linkbox .input { font-family:var(--mono); font-size:var(--t1); }

.toast.out { animation:toastout .25s ease-in both; } @keyframes toastin { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } } @keyframes toastout { to { opacity:0; transform:translateX(16px); } }
.toast .chip { width:28px; height:28px; border-radius:8px; background:var(--surface-gray-2); color:var(--ink-gray-7); display:grid; place-items:center; flex:none; } .toast .chip .ico { width:15px; height:15px; }
.toast b { display:block; font-weight:600; } .toast span.m { color:var(--muted-fg); font-size:var(--t1); display:block; }


/* page, list and dialog motion */
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
@keyframes fadeout { to { opacity:0; } }
@keyframes dlgout { to { opacity:0; transform:translateY(6px) scale(.99); } }
.view-in .main, .view-in .landing, .view-in .formcard, .view-in .clientwrap > .main, .view-in .pay2 { animation:rise .42s cubic-bezier(.2,.7,.2,1) both; }
.view-in .att-list li, .view-in .rows > li, .view-in tbody tr, .view-in .fclip, .view-in .easy, .view-in .kpi, .view-in .chain li { animation:rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--n, 0) * 38ms + 90ms); }
.overlay.closing { animation:fadeout .17s ease-in both; } .overlay.closing .dialog { animation:dlgout .17s ease-in both; }
.overlay.static, .overlay.static .dialog { animation:none; }
.bd.still { cursor:default; }

/* prototype bar */

#proto span { padding:0 8px 0 10px; opacity:.65; white-space:nowrap; }

#proto button[aria-pressed="true"] { background:var(--surface-base); color:var(--ink-gray-9); }
#proto button.reset { opacity:.7; } #proto[hidden] { display:none; }

.body { flex:1; min-height:0; overflow:auto; padding-bottom:72px; }

/* sidebar: workspace switcher + nav + records */

.brandbtn:hover { background:var(--surface-gray-3); } .brandbtn .bt { display:grid; min-width:0; line-height:1.2; } .brandbtn .bt b { font-size:var(--t2); font-weight:600; color:var(--ink-gray-9); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .brandbtn .bt span { font-size:var(--t1); color:var(--ink-gray-5); }

[data-tip]::before { content:''; position:absolute; left:50%; bottom:calc(100% + 3px); transform:translate(-50%,4px); border:5px solid transparent; border-top-color:var(--surface-gray-10,#18181b); border-bottom:0; opacity:0; transition:opacity .12s, transform .12s; pointer-events:none; z-index:60; }
[data-tip]:hover::after, [data-tip]:focus-visible::after, [data-tip]:hover::before, [data-tip]:focus-visible::before { opacity:1; transform:translate(-50%,0); }
.hdr [data-tip]::after { bottom:auto; top:calc(100% + 8px); } .hdr [data-tip]::before { bottom:auto; top:calc(100% + 3px); border-top-color:transparent; border-bottom:5px solid var(--surface-gray-10,#18181b); border-top:0; }
.hdr .ibtn[data-tip]::after { left:auto; right:0; transform:translate(0,4px); } .hdr .ibtn[data-tip]:hover::after { transform:none; }
@media (hover:none) { [data-tip]::after, [data-tip]::before { display:none; } }

/* =====================================================================
   v6 skin: "Soft Cards, blue". Grey page, white cards, blue actions, tighter corners.
   New component classes are prefixed g6- so they never collide with older ones.
   ===================================================================== */

  --c-page:#F5F6F8; --c-card:#FFFFFF; --c-well:#EEF0F3; --c-line:#E4E7EC; --c-line2:#EEF0F3; --c-ink:#101828; --c-ink2:#344054; --c-mute:#667085; --c-faint:#98A2B3; --c-blue:#2F5BEA; --c-bsoft:#EAF0FF; --c-hover:#F9FAFB;
  --h0:#EEF0F3; --h1:#E6EDFF; --h2:#BBCBFF; --h3:#7B9BFF; --h4:#2F5BEA;
  --page:var(--c-page); --bg:var(--c-page); --card:var(--c-card); --border:var(--c-line); --outline-gray-1:var(--c-line2); --outline-gray-2:var(--c-line); --surface-sidebar:var(--c-card);
  --accent:var(--c-blue); --accent-soft:var(--c-bsoft); --b6:#2F5BEA; --ink-gray-9:var(--c-ink); --ink-gray-8:var(--c-ink); --ink-gray-7:var(--c-ink2); --ink-gray-6:var(--c-ink2); --ink-gray-5:var(--c-mute); --r-lg:12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-page:#0D0F13; --c-card:#161920; --c-well:#20242C; --c-line:#2A2F39; --c-line2:#222730; --c-ink:#F2F4F7; --c-ink2:#D0D5DD; --c-mute:#98A2B3; --c-faint:#667085; --c-blue:#6E8FFF; --c-bsoft:#1B2750; --c-hover:#1B1F27; --h0:#20242C; --h1:#1F2C57; --h2:#2E4390; --h3:#4A6DE0; --h4:#7FA0FF; } }
:root[data-theme="dark"] { --c-page:#0D0F13; --c-card:#161920; --c-well:#20242C; --c-line:#2A2F39; --c-line2:#222730; --c-ink:#F2F4F7; --c-ink2:#D0D5DD; --c-mute:#98A2B3; --c-faint:#667085; --c-blue:#6E8FFF; --c-bsoft:#1B2750; --c-hover:#1B1F27; --h0:#20242C; --h1:#1F2C57; --h2:#2E4390; --h3:#4A6DE0; --h4:#7FA0FF; }
body { font-family:var(--font); letter-spacing:0; }
