<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayGuard Pixel</title>
<meta name="description" content="PayGuard prototype: show the work, get paid, then hand over the files.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='5' y='5' width='10' height='10' fill='%231F3BFF'/%3E%3Crect x='1' y='1' width='10' height='10' fill='%23FF5000' stroke='%2323262F' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  /* Three colours and grays. Orange = the freelancer's surface, blue = the client's. No black. */
  --orange:#FF5000;
  --blue:#1F3BFF;
  --white:#FFFFFF;
  --g100:#F2F3F5;
  --g300:#C9CDD4;
  --g500:#8B919D;
  --g700:#4A505C;
  --g900:#23262F;             /* darkest value in the system */
  --f-display:var(--f-ui);       /* big headings are Space Mono bold too */
  --f-ui:'Space Mono',ui-monospace,monospace;
  --f-mono:var(--f-ui);          /* no third typeface: the secondary font does labels and numbers too */
  --tint:#FFEEE6;                /* the orange at 10% */
  --pri:var(--orange); --sec:var(--blue); --pri-body:var(--g900);
}
body[data-mode=client]{--pri:var(--blue);--sec:var(--orange);--pri-body:var(--white)}
*{box-sizing:border-box;font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"dlig" 0,"calt" 0}
html,body{margin:0}
body{background:var(--white);color:var(--g900);font:400 15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g900);outline-offset:3px}
.mono{font-family:var(--f-mono)}
.lbl{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.8px}
.muted{color:var(--g700)}
h1,h2,h3{margin:0}
.sr{position:absolute;left:-9999px}

/* ---------- demo bar (tooling, not product) ---------- */
.demo{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 14px;background:var(--g900);color:var(--white);font:700 11px var(--f-mono);letter-spacing:.3px;min-height:34px}
.demo b{color:var(--g300);font-weight:700}
.demo .sp{flex:1}
.dbtn{background:none;border:2px solid var(--g500);color:var(--white);padding:1px 8px;font:inherit}
.dbtn:hover{border-color:var(--white)}
.dbtn[aria-pressed=true]{background:var(--white);color:var(--g900);border-color:var(--white)}
.demo select{background:var(--g900);color:var(--white);border:2px solid var(--g500);padding:1px 4px;font:inherit;max-width:190px}

/* ---------- shared pieces ---------- */
.blk{border:3px solid var(--g900);background:var(--white);color:var(--g900);padding:9px 16px;font:700 13px var(--f-ui);box-shadow:5px 5px 0 var(--sec);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-block}
.blk:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--sec)}
.blk:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--sec)}
.blk.small{padding:4px 10px;font-size:12px;box-shadow:3px 3px 0 var(--g300)}
.blk.fill{background:var(--orange)}
.blk.fillb{background:var(--blue);color:var(--white)}
.blk[disabled]{opacity:.45;pointer-events:none}
.acts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.slab{display:inline-block;font:700 12px var(--f-mono);padding:3px 8px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.slab.you{background:var(--orange);color:var(--g900)}
.slab.client{background:var(--blue);color:var(--white)}
.slab.done{background:var(--g900);color:var(--white)}
.slab.hold,.slab.next{background:var(--g300);color:var(--g900)}
.late{display:inline-block;font:700 11px var(--f-mono);padding:2px 7px;background:var(--white);color:var(--g900);border:2px solid var(--g900);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.ladder{display:inline-flex;gap:3px;vertical-align:middle}
.ladder i{width:13px;height:13px;background:var(--g300);display:block}
.ladder i.on.you{background:var(--orange)} .ladder i.on.client{background:var(--blue)} .ladder i.on.done,.ladder i.on.hold{background:var(--g900)}
.segbar{display:inline-flex;gap:3px}
.segbar i{width:22px;height:12px;background:var(--g300);display:block}
.segbar i.you{background:var(--orange)} .segbar i.client{background:var(--blue)} .segbar i.done{background:var(--g900)} .segbar i.hold{background:var(--g500)}
.ico{display:inline-block;vertical-align:middle;shape-rendering:crispEdges}
.card{background:var(--white);border:3px solid var(--g900);box-shadow:6px 6px 0 var(--sec);padding:18px}
.card .lbl{color:var(--g700)}
ul.plain{list-style:none;margin:10px 0 0;padding:0;font-size:14px}
ul.plain li{padding:6px 0 6px 18px;position:relative}
ul.plain li::before{content:"";position:absolute;left:0;top:14px;width:8px;height:8px;background:var(--orange)}
ul.files li{font:400 12px var(--f-mono);display:flex;justify-content:space-between;gap:10px;padding-left:0}
ul.files li::before{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:10px 0 0;font-size:14px}
.kv dt{color:var(--g700)} .kv dd{margin:0;text-align:right;font:400 12px var(--f-mono);padding-top:2px}
.fine{font-size:13px;color:var(--g700);margin:12px 0 0;max-width:62ch}
.lock{display:inline-block;font:700 11px var(--f-mono);padding:2px 7px;white-space:nowrap}
.lock.l{background:var(--blue);color:var(--white)} .lock.o{background:var(--orange);color:var(--g900)} .lock.g{background:var(--g300);color:var(--g900)}
.field{width:100%;border:3px solid var(--g900);padding:9px 10px;font:400 14px var(--f-ui);background:var(--white);color:var(--g900);border-radius:0}
textarea.field{resize:vertical}
.field.mono{font-family:var(--f-mono)}
label.fl{display:block;margin:14px 0 5px;color:var(--g700)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{border:3px dashed var(--g500);padding:34px 22px;text-align:center;max-width:620px}
.empty h3{font:600 28px/1.1 var(--f-display);margin-bottom:8px}
.empty p{margin:0 0 18px;color:var(--g700)}
.note{margin:0 0 22px;padding:12px 14px;max-width:560px;background:var(--white);color:var(--g900);border:3px solid var(--g900);box-shadow:6px 6px 0 var(--sec);font-size:15px}
.note .lbl{display:block;color:var(--g700);margin-bottom:4px}
.tabs{display:flex;border:3px solid var(--g900);background:var(--white);max-width:540px}
.tabs button{flex:1;border:0;background:var(--white);padding:9px 8px;font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.6px;color:var(--g700)}
.tabs button + button{border-left:3px solid var(--g900)}
.tabs button[aria-pressed=true]{background:var(--g900);color:var(--white)}
.dbtn[aria-pressed=true]{font-weight:700}

/* ---------- freelancer app ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 34px)}
.rail{background:var(--blue);border-right:4px solid var(--g900);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:34px;height:calc(100vh - 34px);align-self:start;overflow-y:auto}
.mark{font:700 21px var(--f-display);letter-spacing:.5px;color:var(--g900);display:flex;align-items:center;gap:12px;margin:0 0 22px 4px;background:none;border:0;padding:0;text-align:left}
.mark i{width:18px;height:18px;background:var(--white);box-shadow:6px 6px 0 var(--orange);display:block;border:3px solid var(--g900)}
.rail .mark{color:var(--white)}
.rail .mark i{border-color:var(--white)}
.mark .via{font:400 11px var(--f-mono);letter-spacing:.3px;color:var(--g700)}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;border:3px solid transparent;background:none;padding:8px 12px;font:600 22px var(--f-display);color:var(--white);text-align:left}
.nav button:hover{border-color:var(--white)}
.nav button[aria-current=page]{background:var(--white);color:var(--g900);border-color:var(--g900);box-shadow:5px 5px 0 var(--orange)}
.nav .ct{font:700 12px var(--f-mono);background:var(--orange);color:var(--g900);padding:1px 7px;min-width:22px;text-align:center}
.nav .ct.z{background:none;color:var(--white);border:2px solid var(--white)}
.rail .blk{box-shadow:5px 5px 0 var(--orange)}
.rail .blk.fill{background:var(--white)}
.rail .sp{flex:1;min-height:14px}
.rail .me{border-top:2px solid rgba(255,255,255,.45);padding-top:12px;margin-top:12px;font-size:13px;line-height:1.35;color:var(--white)}
.rail .me b{display:block;font:700 16px var(--f-ui)}
.rail .me span{font:400 12px var(--f-mono);color:var(--white);opacity:.85}
.page{padding:34px 40px 100px;max-width:1220px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.ph h1{font:600 clamp(40px,5.4vw,72px)/.98 var(--f-display);overflow-wrap:anywhere}
.ph .lbl{color:var(--g700);margin-bottom:8px;display:block}
.bignum{font:700 clamp(34px,4.4vw,56px)/1 var(--f-mono);letter-spacing:-.05em}
.bignum + .lbl{margin:6px 0 0;display:block;color:var(--g700)}
.sec{margin:0 0 44px}
.sec > h2{font:600 28px/1.1 var(--f-display);margin-bottom:6px;display:flex;align-items:baseline;gap:12px}
.sec > h2 .lbl{color:var(--g700)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--g300);align-items:center}
.arow .t{font:600 28px/1.05 var(--f-display);background:none;border:0;padding:0;text-align:left;color:var(--g900);overflow-wrap:anywhere}
.arow .t:hover{color:var(--blue)}
.arow .sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 4px;font:400 12px var(--f-mono);color:var(--g700)}
.arow p{margin:0;font-size:15px;max-width:62ch}
.thead,.tr{display:grid;grid-template-columns:minmax(0,2.3fr) 1.1fr 1.5fr 1fr .9fr;gap:18px;align-items:center}
.thead{padding:0 0 10px;border-bottom:1px solid var(--g300);color:var(--g700)}
.tr{padding:18px 0;border-bottom:1px solid var(--g300);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tr:hover .pt{color:var(--blue)}
.tr .pt{font:600 26px/1.05 var(--f-display);overflow-wrap:anywhere}
.tr .cl{font:400 12px var(--f-mono);color:var(--g700);margin-top:4px}
.tr .nowc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:14px}
.tr .amt{font:700 15px var(--f-mono);text-align:right}
.filters{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:24px}
.filters .tabs{max-width:none;flex:0 0 auto}
.filters .tabs button{white-space:nowrap;padding:9px 14px}
.filters .tabs button i{font-style:normal;margin-left:6px;opacity:.7}
.search{flex:0 1 280px;width:auto;min-width:0}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-bottom:40px}
.tile4{border:3px solid var(--g900);padding:16px;background:var(--white);box-shadow:6px 6px 0 var(--g300)}
.tile4.lead{background:var(--orange);box-shadow:6px 6px 0 var(--blue)}
.tile4 .n{font:700 30px/1.1 var(--f-mono);letter-spacing:-.05em;margin:10px 0 4px}
.tile4 p{margin:0;font-size:12px;color:var(--g700)}
.tile4.lead p,.tile4.lead .lbl{color:var(--g900)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.7px;color:var(--g700);padding:0 10px 10px 0;border-bottom:1px solid var(--g300)}
.tbl td{padding:12px 10px 12px 0;border-bottom:1px solid var(--g100);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .mono{font-size:13px}
.scroll{overflow-x:auto}

/* project page */
.pbanner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--orange);border:3px solid var(--g900);box-shadow:6px 6px 0 var(--blue);padding:14px 18px;margin:0 0 28px}
.pbanner b{font:600 20px var(--f-display)}
.sharebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font:400 12px var(--f-mono)}
.sharebar code{background:var(--g100);padding:5px 9px;border:2px solid var(--g300)}
.ptabs{display:flex;gap:0;border-bottom:2px solid var(--g300);margin:0 0 26px;overflow-x:auto}
.ptabs button{border:0;background:none;padding:10px 18px;font:600 18px var(--f-display);color:var(--g700);border-bottom:6px solid transparent;margin-bottom:-4px;white-space:nowrap}
.ptabs button[aria-pressed=true]{color:var(--g900);border-bottom-color:var(--orange)}
.stagelist{display:grid;gap:0}
.strow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--g300);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.strow .n{font:700 14px var(--f-mono);background:var(--g300);padding:3px 0;text-align:center}
.strow[aria-pressed=true] .n{background:var(--orange)}
.strow[aria-pressed=true]{background:var(--g100)}
.strow b{font:600 20px var(--f-display);display:block}
.strow .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.strow .meta span.mono{font-size:12px;color:var(--g700)}
.spanel{margin-top:26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.spanel h2{font:600 clamp(32px,4vw,54px)/.98 var(--f-display);margin:8px 0 10px}
.spanel .say{font-size:19px;line-height:1.35;max-width:46ch;margin:0 0 20px}
.meter{height:14px;background:var(--g100);border:3px solid var(--g900);margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--orange)}
.vlist{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.vlist li{padding:5px 0;display:flex;justify-content:space-between;gap:10px}
.drop{border:3px dashed var(--g900);padding:14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.timeline{list-style:none;margin:0;padding:0;max-width:760px}
.timeline li{display:grid;grid-template-columns:78px 14px minmax(0,1fr);gap:16px;padding:0 0 20px;position:relative;align-items:start}
.timeline li::before{content:"";position:absolute;left:101px;top:16px;bottom:-4px;width:2px;background:var(--g500)}
.timeline li:last-child::before{display:none}
.timeline .d{font:700 12px var(--f-mono);color:var(--g700);line-height:20px}
.timeline .pt{width:14px;height:14px;margin-top:3px;background:var(--g500);position:relative;z-index:1}
.timeline .pt.you{background:var(--orange)} .timeline .pt.client{background:var(--blue)}
.contract{border:3px solid var(--g900);padding:26px 28px;max-width:760px;background:var(--white);box-shadow:6px 6px 0 var(--g300)}
.contract h2{font:600 30px/1.1 var(--f-display);margin-bottom:14px}
.contract ol{margin:0;padding-left:22px}
.contract li{margin:0 0 12px;font-size:14.5px}
.contract li b{display:block;font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.6px;color:var(--g700)}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.sig{border-top:3px solid var(--g900);padding-top:8px;min-height:84px}
.sig .nm{font:400 30px/1.2 'Brush Script MT','Segoe Script',cursive;min-height:42px}
.sig img,.sig canvas{max-width:100%;height:46px;display:block}
.signpad{margin-top:14px;max-width:560px}
.signpad canvas{width:100%;height:130px;border:3px solid var(--g900);background:var(--white);touch-action:none;display:block}

/* calendar */
.calhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.calhead h2{font:600 34px var(--f-display);min-width:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:400 12px var(--f-mono);color:var(--g700);margin:0 0 14px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:3px solid var(--g900);border-right:0;border-bottom:0}
.calgrid .dow{background:var(--g900);color:var(--white);font:700 11px var(--f-mono);text-transform:uppercase;padding:5px 7px;border-right:3px solid var(--g900)}
.day{min-height:112px;border-right:3px solid var(--g900);border-bottom:3px solid var(--g900);padding:5px;position:relative;min-width:0}
.day.out{background:var(--g100)}
.day .dn{font:700 12px var(--f-mono);color:var(--g700)}
.day.today{box-shadow:inset 0 0 0 2px var(--orange)}
.day.today .dn{color:var(--g900);font-weight:700}
.ev{display:block;width:100%;text-align:left;border:0;font:700 11px var(--f-mono);padding:3px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.deliver{background:var(--orange);color:var(--g900)}
.ev.reply,.ev.pay{background:var(--blue);color:var(--white)}
.ev.paid{background:var(--g300);color:var(--g900)}
.ev.late{box-shadow:inset 0 0 0 2px var(--g900)}
.more{font:700 11px var(--f-mono);color:var(--g700);margin-top:3px}
.agenda{border:3px solid var(--g900);box-shadow:6px 6px 0 var(--g300);padding:14px 16px;background:var(--white)}
.agenda h3{font:600 20px var(--f-display);margin-bottom:6px}
.agenda .ag{padding:9px 0;border-top:2px dotted var(--g300);font-size:13px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;display:block}
.agenda .ag:hover b{color:var(--blue)}
.agenda .ag b{display:block;font:700 13px var(--f-ui)}
.agenda .ag span{font:400 11px var(--f-mono);color:var(--g700)}

/* plan */
.plan{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;align-items:start}
.stagerow{border:3px solid var(--g900);padding:14px;margin-bottom:14px;background:var(--white);position:relative}
.stagerow .xb{position:absolute;right:8px;top:8px}
.optrow{display:flex;gap:10px;flex-wrap:wrap}
.opt{border:3px solid var(--g900);background:var(--white);padding:7px 14px;font:700 13px var(--f-mono)}
.opt[aria-pressed=true]{background:var(--orange)}
.opt[disabled]{opacity:.5}
.sticky{position:sticky;top:52px}
.preview-sentence{font:600 24px/1.2 var(--f-display);margin:8px 0 14px}

/* ---------- intro (scroll-driven particles) ---------- */
.intro{height:320vh;background:var(--tint);position:relative}
.istage{position:sticky;top:34px;height:calc(100vh - 34px);overflow:hidden}
#hero{position:absolute;inset:0;width:100%;height:100%;display:block}
#uil{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.itop{z-index:5}.imsg{z-index:4}
.itop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:22px 32px}
.itop .mark{margin:0}
.imsg{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:0 clamp(20px,6vw,96px);gap:36px;pointer-events:none;opacity:1}
.chips-h{display:flex;flex-direction:column;align-items:flex-start;gap:.3em;font:600 clamp(13px,calc((100vw - 2 * clamp(20px,6vw,96px)) / 24),70px)/1 var(--f-display);color:var(--g900)}
.crow2{display:flex;gap:.3em;align-items:center;white-space:nowrap}
.cc{display:inline-flex;align-items:center;justify-content:center;padding:.36em .68em .44em;border:3px solid var(--g900);color:var(--g900);flex:0 0 auto;opacity:0;line-height:1}
.cc.pill{border-radius:999px} .cc.o{background:var(--orange)} .cc.w{background:var(--white)} .cc.b{background:var(--blue);color:var(--white)}
.cc.dot,.cc.sqs{width:1.55em;height:1.55em;padding:0}
.cc.dot{border-radius:50%}
.cc .ico{width:.9em;height:.9em}
.imsg .blk{pointer-events:none;opacity:0}
.blk.big{font-size:20px;padding:16px 30px;box-shadow:7px 7px 0 var(--blue)}
.icue{position:absolute;left:32px;bottom:26px;text-align:left;font:700 12px var(--f-ui);text-transform:uppercase;letter-spacing:1.4px;color:var(--g900)}
.icue span{display:block;width:3px;height:30px;background:var(--g900);margin:10px 0 0 6px;animation:cue 1.4s steps(5) infinite}
@keyframes cue{0%{transform:scaleY(.2);transform-origin:top}60%{transform:scaleY(1);transform-origin:top}61%{transform-origin:bottom}100%{transform:scaleY(.1);transform-origin:bottom}}
.iload{position:absolute;left:0;right:0;top:24px;text-align:center;display:none}
.iload.on{display:block}
.iload b{display:block;font:700 13px var(--f-ui);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.ibar{display:flex;gap:5px;justify-content:center}
.ibar i{width:18px;height:14px;background:var(--orange);opacity:.18}
.ibar i.on{opacity:1}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin:0 0 38px}
.stats div{min-width:150px}
.stats b{display:block;font:700 24px/1.1 var(--f-ui);letter-spacing:-.04em}
.stats .lbl{color:var(--g700)}
.start{border:4px solid var(--g900);box-shadow:10px 10px 0 var(--orange);padding:30px;max-width:780px;margin:0 0 44px;background:var(--white)}
.start p{font-size:18px;max-width:52ch;margin:0 0 24px}
.stepper{display:flex;list-style:none;padding:0;margin:0 0 26px;border:3px solid var(--g900);max-width:760px;background:var(--white)}
.stepper li{flex:1;padding:10px 12px;font:700 13px var(--f-ui);display:flex;gap:10px;align-items:center;border-left:3px solid var(--g900)}
.stepper li:first-child{border-left:0}
.stepper li b{font:700 15px var(--f-ui);background:var(--g300);width:26px;height:26px;display:grid;place-items:center;flex:0 0 26px}
.stepper li.on{background:var(--orange)} .stepper li.on b{background:var(--white)}
.stepper li.done{background:var(--g900);color:var(--white)} .stepper li.done b{background:var(--white);color:var(--g900)}
.stepper.big{max-width:none;margin-bottom:22px}
.linkbig{font:700 clamp(15px,1.8vw,20px)/1.3 var(--f-ui);overflow-wrap:anywhere;margin:12px 0 18px;padding:14px;background:var(--g100);border:3px solid var(--g900)}
.qr{width:150px;height:150px;border:3px solid var(--g900);display:block;image-rendering:pixelated}
.setup{max-width:760px;margin:0 auto;padding:40px 24px 90px}
.enter{animation:enter .55s steps(7) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* upload drawer */
dialog.drw{position:fixed;inset:0 0 0 auto;margin:0;max-width:none;max-height:none;width:min(500px,100%);height:100%;border:0;border-left:4px solid var(--g900);box-shadow:none;padding:24px 26px 40px;overflow:auto;animation:slidein .28s steps(6)}
dialog.drw::backdrop{background:rgba(35,38,47,.6)}
@keyframes slidein{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.drw-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.drw-h .lbl{color:var(--g700)}
dialog.drw h2{font:600 clamp(32px,4vw,44px)/1 var(--f-display);margin:6px 0 18px}
.dz{border:3px dashed var(--g900);padding:26px 18px;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--g100)}
.dz.over{background:var(--orange)}
.dz b{font:700 18px var(--f-ui)}
.drwlist small{display:block;color:var(--g700);font-size:11px;margin-top:2px}
.drwlist li{align-items:center}

/* ---------- client link page ---------- */
.cbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:2px solid var(--g300);background:var(--white);position:sticky;top:34px;z-index:30}
.cbar .mark{margin:0}
.cbar .mark i{background:var(--blue)}
.cbar .sp{flex:1}
.cbar .me{font:400 12px var(--f-mono);color:var(--g700)}
.chero{background:var(--blue);color:var(--white);padding:46px 40px 130px;border-bottom:4px solid var(--g900)}
.chero .lbl{color:var(--white);opacity:.9}
.chero h1{font:600 clamp(44px,7vw,108px)/.94 var(--f-display);margin:14px 0 14px;overflow-wrap:anywhere;max-width:16ch}
.chero p{margin:0;font-size:18px;max-width:46ch}
.cwrap{max-width:1080px;margin:-96px auto 0;padding:0 24px 100px;position:relative}
.now{background:var(--white);border:4px solid var(--g900);box-shadow:10px 10px 0 var(--orange);padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;margin-bottom:56px}
.now h2{font:600 clamp(30px,4vw,50px)/1 var(--f-display);margin:8px 0 8px}
.now p{margin:0;font-size:17px;max-width:52ch}
.now .lbl{color:var(--g700)}
.csec{margin:0 0 56px}
.csec > h2{font:600 34px/1 var(--f-display);margin-bottom:6px}
.csec > .sub{margin:0 0 16px;color:var(--g700)}
.jrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:16px;padding:18px 0;border-top:1px solid var(--g300);align-items:start;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.jrow:last-of-type{border-bottom:1px solid var(--g300)}
.jrow .n{font:600 30px/1 var(--f-display);color:var(--blue)}
.jrow b{font:600 22px var(--f-display);display:block}
.jrow .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;font:400 12px var(--f-mono);color:var(--g700)}
.jrow .inc{font-size:14px;color:var(--g700);margin:6px 0 0}
.jrow .amt{font:700 18px var(--f-mono);text-align:right}
.jrow[aria-expanded=true]{background:var(--g100)}
.jx{padding:0 0 16px 70px;background:var(--g100)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px}
.ledger{background:var(--white);color:var(--g900);border:3px solid var(--g900);box-shadow:6px 6px 0 var(--sec)}
.ledger div{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;font-size:14px}
.ledger b{font:700 14px var(--f-mono)}
.ledger .tot{border-top:3px solid var(--g900);font-weight:700}
.ledger .tot b{font-size:18px}
.dateslist{list-style:none;margin:0;padding:0}
.dateslist li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;padding:11px 0;font-size:15px;align-items:baseline}
.dateslist .dd{font:700 14px var(--f-mono)}
.dateslist small{display:block;font:400 12px var(--f-mono);color:var(--g700)}

/* client sub-pages (review / pay / done / invite) */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:calc(100vh - 34px - 62px)}
.split > *{min-width:0}
.split-l{padding:28px 36px 56px 28px;background:var(--white)}
.split-r{background:var(--blue);color:var(--white);padding:56px 40px;border-left:4px solid var(--g900)}
.split-r.orange{background:var(--orange);color:var(--g900)}
.split-r .lbl{color:var(--white)} .split-r.orange .lbl{color:var(--g900)}
.split-r h1{font:600 clamp(36px,5vw,70px)/.96 var(--f-display);margin:12px 0 12px;overflow-wrap:anywhere}
.split-r h1.giant{font:700 clamp(54px,8vw,104px)/.95 var(--f-mono);letter-spacing:-.05em;margin:10px 0 22px -3px}
.split-r .say{font-size:20px;line-height:1.35;max-width:34ch;margin:0 0 24px}
.split-r .fine{color:var(--white)} .split-r.orange .fine{color:var(--g900)}
.crumbs{display:flex;gap:22px;margin-bottom:18px;min-height:20px}
.back{border:0;background:none;padding:0;font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.8px;color:var(--g700)}
.back:hover{color:var(--g900)}
.previewing{display:flex;justify-content:space-between;align-items:center;padding:8px 28px;background:var(--g900);color:var(--white)}
.previewing .lbl{color:var(--white)} .previewing .back{color:var(--g300);margin:0}
.chips{display:flex;gap:4px;font:400 12px var(--f-mono);line-height:1.2;max-width:520px;margin-bottom:12px}
.chips span{padding:8px 10px;background:var(--g100);color:var(--g900)}
.chips .nm{flex:1} .chips .nm i{font-style:normal;color:var(--orange)} .chips .no{min-width:38px;text-align:center}
.manifest{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:6px 0;max-width:760px}
.manifest b{font:600 22px var(--f-display)}
.manifest .mono{font-size:13px;color:var(--g700)}
.pvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:28px;max-width:760px;margin-top:26px}
.pv{margin:0}
.pvbox{border:3px solid var(--g900);box-shadow:8px 8px 0 var(--g300);line-height:0}
.pvbox canvas{width:100%;display:block;image-rendering:pixelated}
.pv figcaption{margin-top:14px;font-size:13px;line-height:1.35;color:var(--g700)}
.pv figcaption b{display:block;font:700 13px var(--f-mono);color:var(--g900);overflow-wrap:anywhere}
.bigicon{border:3px solid var(--g900);box-shadow:8px 8px 0 var(--blue);padding:34px;display:flex;justify-content:center;max-width:520px;background:var(--white)}
.bigicon.o{background:var(--orange);box-shadow:8px 8px 0 var(--g300)}
.form{background:var(--white);color:var(--g900);border:3px solid var(--g900);box-shadow:6px 6px 0 var(--sec);padding:16px;margin:0 0 8px;max-width:520px}
.form .lbl{color:var(--g700);display:block;margin-bottom:6px}
.pbar{display:flex;gap:6px;margin-top:28px;max-width:520px}
.pbar i{flex:1;height:26px;background:var(--white);opacity:.25}
.pbar i.on{opacity:1}
.payform{max-width:520px}
.payform .say{color:var(--white);font-size:16px}
.qrbox{display:flex;gap:18px;align-items:center;background:var(--white);color:var(--g900);border:3px solid var(--g900);padding:14px;max-width:520px;margin-bottom:16px;box-shadow:6px 6px 0 var(--orange)}
.qrbox code{display:block;font:700 15px var(--f-mono);margin:4px 0 8px}
.receipt{max-width:520px;margin-top:30px;border:3px dashed var(--g900);padding:16px}
.inv-h{font:600 clamp(36px,5vw,72px)/.98 var(--f-display);margin:10px 0 26px;overflow-wrap:anywhere}
.inv-stages{list-style:none;margin:0;padding:0;max-width:640px}
.inv-stages li{display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--g300);align-items:start}
.inv-stages .n{font:700 14px var(--f-mono);background:var(--orange);padding:3px 0;text-align:center}
.inv-stages .inc{font-size:13px;color:var(--g700);margin-top:2px}
.inv-stages .r{text-align:right;display:flex;flex-direction:column;gap:2px;font-size:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 28px;padding:0;max-width:560px}
.steps li{border-top:4px solid var(--white);padding-top:8px;font-size:14px}
.steps b{display:block;font:600 30px var(--f-display)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.boxes section{background:var(--white);color:var(--g900);border:3px solid var(--g900);padding:16px;box-shadow:6px 6px 0 var(--sec)}
.boxes .lbl{color:var(--g700)}

/* toast, dialog, font lab, palette */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--g900);color:var(--white);padding:10px 16px;font:700 12px var(--f-mono);z-index:90;opacity:0;pointer-events:none;transition:opacity .15s;max-width:92vw;text-align:center}
.toast.on{opacity:1}
dialog{border:3px solid var(--g900);box-shadow:10px 10px 0 var(--orange);padding:24px;max-width:460px;width:calc(100% - 32px);color:var(--g900);background:var(--white)}
dialog::backdrop{background:rgba(35,38,47,.72)}
dialog h3{margin:0 0 10px;font:600 24px/1.1 var(--f-display)}
dialog p{margin:0 0 20px}
dialog.pal{padding:0;max-width:560px;top:12vh;margin:0 auto}
.pal input{width:100%;border:0;border-bottom:3px solid var(--g900);padding:16px 18px;font:700 18px var(--f-mono);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:10px 12px;text-align:left;font-size:15px}
.pal li button[aria-selected=true]{background:var(--orange)}
.pal li span{font:400 11px var(--f-mono);color:var(--g700);text-transform:uppercase}
.lab{position:fixed;right:20px;top:46px;width:320px;background:var(--white);padding:18px;z-index:80;display:none;border:3px solid var(--g900);box-shadow:8px 8px 0 var(--orange)}
.lab.on{display:block}
.lab h3{font:600 18px var(--f-display)}
.lab .pre{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.lab small{display:block;color:var(--g700);margin-top:8px;font-size:12px}
.lab .row{display:flex;gap:10px;margin-top:14px}

h1,h2,h3,.stamp,.chips-h{letter-spacing:-.045em}
h1,h2,h3,button,input,select,textarea{font-feature-settings:"liga" 0,"clig" 0,"dlig" 0,"calt" 0 !important}   
/* one typeface: Space Mono, bold and regular */
.mark,.nav button,.ptabs button,.pbanner b,.arow .t,.tr .pt,.sec > h2,.strow b,.jrow b,.jrow .n,.calhead h2,.agenda h3,.manifest b,dialog h3,.empty h3,.preview-sentence,.contract h2,.csec > h2,.steps b,.lab h3,.tile4 .n,.bignum,.split-r h1.giant{font-family:var(--f-ui);font-weight:700;letter-spacing:0}
.mark{font-size:16px;letter-spacing:.4px}
.nav button{font-size:15px}
.arow .t{font-size:20px;line-height:1.2}
.tr .pt{font-size:16px;line-height:1.25}
.sec > h2{font-size:18px}
.calhead h2{font-size:22px;min-width:220px}
.strow b{font-size:15px}
.ptabs button{font-size:14px}
.pbanner b{font-size:15px}
.jrow b{font-size:16px} .jrow .n{font-size:22px}
.manifest b{font-size:16px}
.csec > h2{font-size:21px}
.contract h2{font-size:20px}
.empty h3{font-size:18px}
.preview-sentence{font-size:16px;line-height:1.4}
.tile4 .n{font-size:22px;letter-spacing:-.02em}
.bignum{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.03em}
.split-r h1.giant{font-size:clamp(40px,6vw,76px);letter-spacing:-.06em}
.steps b{font-size:20px}
dialog h3{font-size:18px}

/* sticker icons, arrow buttons */
.stk{display:block;filter:drop-shadow(2px 2px 0 var(--g900))}
.arrowbtn{background:none;border:0;padding:4px;display:inline-grid;place-items:center;transform:rotate(-6deg);transition:transform .14s;cursor:pointer;flex:0 0 auto}
.arrowbtn:hover{transform:rotate(0) translateX(4px)}
.blk .stk{display:inline-block;vertical-align:middle;margin:-5px 6px -5px -6px;filter:drop-shadow(1px 1px 0 var(--g900))}
.linkarrow{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;font:700 13px var(--f-ui);color:var(--g900);cursor:pointer}
.linkarrow:hover{text-decoration:underline;text-underline-offset:4px}
.linkarrow .stk{filter:drop-shadow(1px 1px 0 var(--g900))}
.blk .after{display:inline-block}
.blk .after .stk{margin:-5px -6px -5px 4px}

/* pin board */
.pinboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:30px 24px;padding:34px 24px 28px;background-color:var(--g100);background-image:radial-gradient(var(--g300) 1.6px,transparent 1.6px);background-size:22px 22px;border:3px solid var(--g900)}
.pinboard.col{grid-template-columns:minmax(0,1fr);gap:28px;padding:30px 20px 24px}
.pn{position:relative;background:var(--white);border:3px solid var(--g900);padding:20px 14px 14px;box-shadow:5px 5px 0 var(--g300);text-align:left;transform:rotate(var(--r,0deg));transition:transform .15s,box-shadow .15s;display:block;width:100%;cursor:pointer}
.pn:hover{transform:rotate(0) translateY(-3px);box-shadow:7px 8px 0 var(--g300)}
.pn .pin{position:absolute;left:50%;top:-17px;margin-left:-14px}
.pn .dd{display:block;font:700 22px/1 var(--f-ui);letter-spacing:-.04em;margin-bottom:6px}
.pn .tt{display:block;font:700 13px/1.35 var(--f-ui)}
.pn .rr{display:block;font:400 11px var(--f-ui);color:var(--g700);margin-top:8px}
.pn.late{background:var(--g900);color:var(--white)}
.pn.late .rr{color:var(--g300)}
.pn.reply .dd,.pn.pay .dd{color:var(--blue)}
.pn.deliver .dd{color:var(--orange)}

/* receipt */
dialog.rcp{max-width:660px;padding:0;border:3px solid var(--g900);box-shadow:10px 10px 0 var(--blue);overflow:hidden}
.rcpdoc{padding:30px 32px 24px;background:var(--white)}
.rcpdoc .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.rcpdoc h2{font:600 clamp(30px,5vw,46px)/1 var(--f-display);margin-top:6px}
.stamp{font:600 28px var(--f-display);color:var(--orange);border:4px solid var(--orange);padding:4px 14px;transform:rotate(-7deg);letter-spacing:2px;margin-top:6px}
.rparties{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:26px 0 22px;font-size:12px;color:var(--g700)}
.rparties b{display:block;font-size:14px;color:var(--g900);margin:4px 0 2px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th{text-align:left;font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.8px;color:var(--g700);padding:0 0 8px;border-bottom:2px solid var(--g900)}
.rtab td{padding:10px 0;vertical-align:top}
.rtab .r{text-align:right}
.rtab small{display:block;color:var(--g700);font-size:11px;margin-top:2px}
.rtab tr.tot td{border-top:2px solid var(--g900);font-weight:700;font-size:15px;padding-top:12px}
.rkv{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:20px 0 0;font-size:12px}
.rkv dt{color:var(--g700)} .rkv dd{margin:0;text-align:right}
.rcpact{display:flex;gap:14px;padding:16px 32px 22px;background:var(--g100);flex-wrap:wrap}
@media print{body *{visibility:hidden}#rcp,#rcp *{visibility:visible}#rcp{position:fixed;inset:0;box-shadow:none;border:0;max-width:none;margin:0}.rcpact{display:none}}

/* upload rules */
.rule{border:3px solid var(--g900);background:var(--g100);padding:10px 14px;font-size:13px;margin:14px 0 0}
.rule b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
.rule.warn{background:var(--white);box-shadow:4px 4px 0 var(--orange)}
.zone{margin-top:20px}
.zone > .lbl{display:flex;justify-content:space-between;align-items:center;color:var(--g900);margin-bottom:8px;gap:10px}
.hint{font:400 11px var(--f-ui);color:var(--g700);text-transform:none;letter-spacing:0}
.dz.sm{padding:16px 14px;margin-top:0;flex-direction:row;flex-wrap:wrap;justify-content:center}
.kind{display:inline-block;font:700 10px var(--f-ui);padding:1px 5px;letter-spacing:.5px;margin-right:6px;vertical-align:1px}
.kind.p{background:var(--orange);color:var(--g900)} .kind.o{background:var(--blue);color:var(--white)}
.delivery{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.crow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--g300);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.crow:hover .cn{color:var(--blue)}
.crow .cn{font:700 17px var(--f-ui)}
.crow .cs{font-size:12px;color:var(--g700)}

@media (max-width:980px){
  .calwrap,.spanel,.plan,.cgrid{grid-template-columns:minmax(0,1fr)}
  .tiles4{grid-template-columns:1fr 1fr}
  .sticky{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;border-right:0;border-bottom:4px solid var(--g900)}
  .rail .mark{margin:0 8px 0 0;width:100%}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav button{font-size:16px;padding:5px 9px;width:auto;gap:8px}
  .rail .sp,.rail .me{display:none}
  .page{padding:22px 16px 80px}
  .thead{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .tr > :nth-child(2),.tr > :nth-child(4){display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .itop{padding:16px}
  .filters{flex-direction:column;align-items:stretch;gap:12px}
  .filters .tabs{overflow-x:auto}
  .filters .tabs button{padding:8px 10px;font-size:11px}
  .search{flex:1 1 auto;width:100%}
  .stepper li{font-size:11px;padding:8px 6px;gap:6px}
  .split-l{padding:20px 16px 36px}
